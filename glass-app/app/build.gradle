plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myglass.glass'
    compileSdk 33

    defaultConfig {
        applicationId "com.myglass.glass"
        // Google Glass Explorer Edition runs Android 4.4 (API 19).
        minSdk 19
        targetSdk 19
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // The GDK stub jar only exposes the pre-API-21 Glass APIs we compile against.
        abortOnError false
    }
}

dependencies {
    // No GDK dependency: this Glass build does not ship the GDK classes, so the app
    // uses standard Android notifications and views instead.
    testImplementation 'junit:junit:4.13.2'
}
