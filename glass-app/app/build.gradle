plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myglass.glass'
    compileSdk 33

    defaultConfig {
        applicationId "com.myglass.glass"
        // Google Glass Explorer Edition runs Android 4.4 (API 19).
        minSdk 19
        targetSdk 19
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // The GDK stub jar only exposes the pre-API-21 Glass APIs we compile against.
        abortOnError false
    }
}

dependencies {
    // GDK stub jar (compile-only). The real com.google.android.glass.* classes are
    // provided by the Glass system itself (glass-core.jar on the boot classpath), so the
    // app must NOT package them. This lets us use CardBuilder/LiveCard for real timeline
    // cards while remaining compatible with builds that lack the GDK (guarded by a
    // runtime Class.forName check).
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
}
